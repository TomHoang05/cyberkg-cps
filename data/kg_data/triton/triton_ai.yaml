# data/kg_data/triton/triton_ai.yaml
# TRITON — AI Plane nodes
# component_type must be in canonical enum (CYB-12 §III.12):
#   anomaly_detector | classifier | nlp_assistant | digital_twin | intrusion_detection
# AI_Attack_Surface nodes with SHARED tag appear in multiple case files; MERGE handles dedup.

nodes:

  AI_Component:
    - ai_id: "AIC-TRI"
      name: "AI SIS Behavioral Monitor"
      component_type: "anomaly_detector"
      is_hypothetical: true
      description: "Hypothetical LSTM-based anomaly detector that could have flagged unauthorized TriStation commands sent outside maintenance windows, detecting TRITON's attempt to reprogram the SIS."
      source: "CYB-15 v2.0 (instructional extension)"
      source_id_or_url: "internal"
      evidence_class: "instructional_extension"
      confidence: 0.0
      license: "CYB-17 v1.1"

  AI_Attack_Surface:
    # AIS-PI: SHARED across all 4 cases — MERGE key: surface_id
    - surface_id: "AIS-PI"
      name: "Indirect Prompt Injection"
      surface_type: "indirect_prompt_injection"
      is_adversarial: true
      description: "Attacker-controlled content in logs or alerts ingested by LLM security assistant containing injected instructions that manipulate AI behavior"
      aml_technique: "AML.T0051"
      table1_ref: "C3.1"
      source: "MITRE ATLAS + CYB-06 v1.6 C3.1"
      source_id_or_url: "https://atlas.mitre.org/techniques/AML.T0051"
      evidence_class: "instructional_extension"
      confidence: 0.0
      license: "CYB-17 v1.1"

    # AIS-PP: SHARED across Stuxnet, TRITON, German Steel Mill (NOT Colonial)
    - surface_id: "AIS-PP"
      name: "Physical Sensor Perturbation"
      surface_type: "physical_perturbation"
      is_adversarial: true
      description: "Adversarial physical signals designed to corrupt sensor readings fed to AI/ML monitoring — e.g., manipulating pressure/temperature readings to cause false-normal AI assessments"
      aml_technique: "AML.T0020"
      table1_ref: "C3.2"
      source: "MITRE ATLAS + CYB-06 v1.6 C3.2"
      source_id_or_url: "https://atlas.mitre.org/techniques/AML.T0020"
      evidence_class: "instructional_extension"
      confidence: 0.0
      license: "CYB-17 v1.1"

    # AIS-DT: SHARED across all 4 cases
    - surface_id: "AIS-DT"
      name: "Domain Transfer Shift"
      surface_type: "domain_transfer"
      is_adversarial: false
      description: "AI models trained on IT traffic may fail to handle OT protocol distributions"
      table1_ref: "C4.1"
      source: "CYB-06 v1.6 C4.1"
      source_id_or_url: "internal"
      evidence_class: "instructional_extension"
      confidence: 0.0
      license: "CYB-17 v1.1"

    # AIS-EP: SHARED across all 4 cases
    - surface_id: "AIS-EP"
      name: "Error Propagation"
      surface_type: "error_propagation"
      is_adversarial: false
      description: "False positive alerts triggering incorrect automated or operator responses"
      table1_ref: "C4.2"
      source: "CYB-06 v1.6 C4.2"
      source_id_or_url: "internal"
      evidence_class: "instructional_extension"
      confidence: 0.0
      license: "CYB-17 v1.1"
